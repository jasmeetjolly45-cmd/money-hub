<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Much Is My Time Worth?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-forest: #0B3022;
            --bg-input: #123D2D;
            --bg-input-focus: #174A37;
            --cream: #F5F2EB;
            --cream-muted: #D1CBC0;
            --gold: #D4AF37;
            --gold-light: #E6CA65;
            --border-forest: rgba(212, 175, 55, 0.15);
            --border-focus: rgba(212, 175, 55, 0.4);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        @media (prefers-color-scheme: dark) {
            html, body {
                background: #191919;
            }
        }

        .composition {
            position: relative;
            width: 100%;
            max-width: 613px;
            aspect-ratio: 613 / 447;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 36px;
        }

        .widget-card {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--bg-forest);
            border: 1px solid var(--border-forest);
            border-radius: 14px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            padding: 22px 26px;
            box-sizing: border-box;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--gold) transparent;
        }

        .widget-card::-webkit-scrollbar {
            width: 3px;
        }
        .widget-card::-webkit-scrollbar-thumb {
            background-color: var(--gold);
            border-radius: 3px;
        }

        .widget-header {
            text-align: center;
            margin-bottom: 12px;
        }

        .widget-icon {
            font-size: 15px;
            margin-bottom: 2px;
            display: inline-block;
        }

        .widget-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 21px;
            font-weight: 500;
            color: var(--cream);
            margin: 0 0 2px 0;
            letter-spacing: -0.01em;
        }

        .widget-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 11px;
            color: var(--cream-muted);
            margin: 0;
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-label {
            font-size: 8.5px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--cream-muted);
            margin-bottom: 4px;
        }

        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background-color: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .input-field-wrapper:focus-within {
            background-color: var(--bg-input-focus);
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1);
        }

        .input-prefix {
            padding-left: 8px;
            font-size: 11px;
            color: var(--gold);
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--cream);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 11px;
            padding: 7px 8px 7px 4px;
        }

        .input-field::placeholder {
            color: rgba(245, 242, 235, 0.25);
        }

        .actions-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 8px;
        }

        .btn-calculate {
            background-color: var(--gold);
            color: #0B3022;
            border: none;
            border-radius: 5px;
            padding: 8px 16px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-calculate:hover {
            background-color: var(--gold-light);
        }

        .btn-reset {
            background: transparent;
            border: none;
            color: var(--cream-muted);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 11px;
            cursor: pointer;
            padding: 4px 6px;
            transition: color 0.2s ease;
        }

        .btn-reset:hover {
            color: var(--cream);
        }

        .result-area {
            display: none;
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            animation: fadeIn 0.3s ease forwards;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 6px;
        }

        .result-box {
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 6px;
            padding: 6px 10px;
            border-left: 2px solid var(--gold);
        }

        .result-box-label {
            font-size: 8.5px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--cream-muted);
            margin-bottom: 2px;
        }

        .result-box-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            font-weight: 600;
            color: var(--gold);
        }

        .result-insight {
            font-family: 'Cormorant Garamond', serif;
            font-size: 12px;
            font-style: italic;
            color: var(--cream);
            background-color: rgba(212, 175, 55, 0.05);
            padding: 5px 8px;
            border-radius: 5px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            margin: 0;
        }

        .error-message {
            color: #E06D53;
            font-size: 10px;
            margin-top: 2px;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Enhanced Mobile Stack Trigger */
        @media (max-width: 768px) {
            .inputs-grid {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .composition {
                padding: 16px;
            }
            .widget-card {
                padding: 16px;
            }
            .widget-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="composition">
        <div class="widget-card">
            
            <div class="widget-header">
                <div class="widget-icon">💼</div>
                <h1 class="widget-title">How Much Is My Time Worth?</h1>
                <p class="widget-subtitle">Turn money into time. Understand the true human cost of your purchases.</p>
            </div>

            <div class="inputs-grid" id="inputSection">
                <div class="input-group">
                    <label class="input-label" for="incomeInput">Annual Income</label>
                    <div class="input-field-wrapper">
                        <span class="input-prefix">$</span>
                        <input type="number" id="incomeInput" class="input-field" placeholder="60000" min="1" step="any">
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="hoursInput">Hours / Week</label>
                    <div class="input-field-wrapper">
                        <input type="number" id="hoursInput" class="input-field" placeholder="40" min="0.1" step="any" style="padding-left: 8px;">
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="priceInput">Cost ($)</label>
                    <div class="input-field-wrapper">
                        <span class="input-prefix">$</span>
                        <input type="number" id="priceInput" class="input-field" placeholder="200" min="0" step="any">
                    </div>
                </div>
            </div>

            <div id="errorMsg" class="error-message">Please enter valid positive numbers.</div>

            <div class="actions-row" id="initialActions">
                <button class="btn-calculate" id="calcBtn">Calculate Time Cost</button>
                <button class="btn-reset" id="resetBtn" style="visibility: hidden;">Reset</button>
            </div>

            <div class="result-area" id="resultArea">
                <div class="result-grid">
                    <div class="result-box">
                        <div class="result-box-label">Hourly Value</div>
                        <div class="result-box-value" id="hourlyResult">$0.00</div>
                    </div>
                    <div class="result-box">
                        <div class="result-box-label">Time Cost</div>
                        <div class="result-box-value" id="timeResult">0.0 hrs</div>
                    </div>
                </div>
                <p class="result-insight" id="insightText">💭 Calculating your time...</p>
                <div style="display: flex; justify-content: flex-end; margin-top: 4px;">
                    <button class="btn-reset" id="resetBtnActive">Reset Calculator</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const calcBtn = document.getElementById('calcBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resetBtnActive = document.getElementById('resetBtnActive');
        const initialActions = document.getElementById('initialActions');
        const resultArea = document.getElementById('resultArea');
        const errorMsg = document.getElementById('errorMsg');

        const incomeInput = document.getElementById('incomeInput');
        const hoursInput = document.getElementById('hoursInput');
        const priceInput = document.getElementById('priceInput');

        const hourlyResult = document.getElementById('hourlyResult');
        const timeResult = document.getElementById('timeResult');
        const insightText = document.getElementById('insightText');

        function performCalculation() {
            const income = parseFloat(incomeInput.value);
            const hoursPerWeek = parseFloat(hoursInput.value);
            const price = parseFloat(priceInput.value);

            if (isNaN(income) || isNaN(hoursPerWeek) || isNaN(price) || income <= 0 || hoursPerWeek <= 0 || price < 0) {
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';

            const annualHours = hoursPerWeek * 52;
            const hourlyVal = income / annualHours;
            const hoursRequired = price / hourlyVal;

            hourlyResult.textContent = `$${hourlyVal.toFixed(2)} / hr`;
            timeResult.textContent = `${hoursRequired.toFixed(1)} hrs`;

            let insight = "";
            if (hoursRequired < 1) {
                const minutes = Math.round(hoursRequired * 60);
                insight = `💭 That's about ${minutes} minutes of work. A minor trade.`;
            } else if (hoursRequired >= 1 && hoursRequired < 4) {
                insight = `💭 That's about ${hoursRequired.toFixed(1)} hours of work — a fraction of your workweek.`;
            } else if (hoursRequired >= 4 && hoursRequired < 8) {
                insight = `💭 That's about ${hoursRequired.toFixed(1)} hours of work — almost a full workday.`;
            } else if (hoursRequired >= 8 && hoursRequired < 24) {
                insight = `💭 That's about ${hoursRequired.toFixed(1)} hours of work — more than a full workday.`;
            } else if (hoursRequired >= 24 && hoursRequired < 40) {
                insight = `💭 That's about ${hoursRequired.toFixed(1)} hours of work — several days spent earning it.`;
            } else {
                insight = `💭 That's about ${hoursRequired.toFixed(1)} hours of work — more than an entire workweek.`;
            }

            insightText.textContent = insight;

            initialActions.style.display = 'none';
            resultArea.style.display = 'block';
            resetBtn.style.visibility = 'visible';
        }

        function resetCalculator() {
            incomeInput.value = '';
            hoursInput.value = '';
            priceInput.value = '';
            errorMsg.style.display = 'none';

            resultArea.style.display = 'none';
            initialActions.style.display = 'flex';
            resetBtn.style.visibility = 'hidden';
        }

        calcBtn.addEventListener('click', performCalculation);
        resetBtn.addEventListener('click', resetCalculator);
        resetBtnActive.addEventListener('click', resetCalculator);

        [incomeInput, hoursInput, priceInput].forEach(element => {
            element.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    performCalculation();
                }
            });
        });
    </script>
</body>
</html>
